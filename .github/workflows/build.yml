name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer www
        run: mkdir -p www && cp garden.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk garden.apk
      - uses: actions/upload-artifact@v4
        with:
          name: garden-apk
          path: garden.apk
      - name: Publier en Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Garden build ${{ github.run_number }}
          files: garden.apk
