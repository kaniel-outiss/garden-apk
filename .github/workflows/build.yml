name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer www
        run: mkdir -p www && cp garden.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Sauvegarde automatique (Documents/PianoTools)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "EXTERNAL_STORAGE\|requestLegacy" android/app/src/main/AndroidManifest.xml
      - name: Partage Android vers Garden (chants ChordPro / texte)
        run: |
          cp android-src/MainActivity.java android/app/src/main/java/com/pianotools/garden/MainActivity.java
          perl -0pi -e 's#(<category android:name="android.intent.category.LAUNCHER" />\s*</intent-filter>)#$1\n<intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="text/*" /></intent-filter>\n<intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="application/*" /></intent-filter>\n<intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><data android:scheme="content" /><data android:mimeType="text/*" /></intent-filter>\n<intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><data android:scheme="content" /><data android:mimeType="application/octet-stream" /></intent-filter>#' android/app/src/main/AndroidManifest.xml
          grep -c "intent.action.SEND" android/app/src/main/AndroidManifest.xml
      - name: Clé de signature fixe (mises à jour sans désinstaller)
        env:
          GARDEN_KEYSTORE: ${{ secrets.GARDEN_KEYSTORE }}
        run: |
          if [ -n "$GARDEN_KEYSTORE" ]; then echo "$GARDEN_KEYSTORE" | base64 -d > android/app/gd.keystore; else cp keys/garden.keystore android/app/gd.keystore; fi
          printf '\nandroid {\n  signingConfigs { gd { storeFile file("gd.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }\n  buildTypes { debug { signingConfig signingConfigs.gd } }\n}\n' >> android/app/build.gradle
      - name: Numéro de version croissant
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk garden.apk
      - uses: actions/upload-artifact@v4
        with:
          name: garden-apk
          path: garden.apk
      - name: Publier en Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Garden build ${{ github.run_number }}
          files: garden.apk
